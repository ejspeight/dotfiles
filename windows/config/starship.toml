"$schema" = "https://starship.rs/config-schema.json"

# Minimal Catppuccin prompt: project and Git on the left, runtime on the right.
add_newline = false
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration$nodejs"

[directory]
style = "bold #89b4fa"
format = "[$path]($style)"
truncation_length = 2
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "#cba6f7"
format = " [$symbol$branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "#f9e2af"
format = " [$all_status$ahead_behind]($style)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "×"

[nodejs]
symbol = " "
style = "#a6e3a1"
format = "[$symbol$version]($style)"

[cmd_duration]
min_time = 2_000
show_milliseconds = false
style = "dimmed #6c7086"
format = "[$duration]($style) "

[character]
success_symbol = " [❯](bold #a6e3a1)"
error_symbol = " [❯](bold #f38ba8)"
vimcmd_symbol = " [❮](bold #cba6f7)"
